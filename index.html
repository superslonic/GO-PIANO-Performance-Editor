.reverbvalue{min-width:34px;text-align:center;font-size:18px;font-weight:750;font-variant-numeric:tabular-nums}.stepbtn{min-width:36px;height:34px;padding:0;font-size:21px;line-height:1;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}.reverbbox .stepbtn{flex:0 0 36px}.reverbbox .reverbvalue{flex:1}.controlrow{display:grid;grid-template-columns:minmax(0,1fr) 92px;align-items:center;gap:8px;margin-top:6px}.sliderwrap{display:flex;align-items:center;gap:8px;min-width:0}.slider{width:100%;min-width:0;height:24px;margin:0;accent-color:var(--accent);touch-action:pan-y}.slidernum{width:54px!important;min-height:36px!important;height:36px;text-align:center;padding:4px 2px!important;font-variant-numeric:tabular-nums}.octrow{margin-top:0}.octrow select{display:block;width:100%;margin-left:0;min-height:36px;height:36px}.hidden{display:none!important}.muted{opacity:.38;filter:grayscale(.35)}.muted select,.muted input,.muted button,.muted .knob{pointer-events:none}.compacttop{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}.splitfield select{width:100%}.buttons{display:flex;gap:6px;flex-wrap:wrap}.liveoption{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--muted);margin-left:auto;white-space:nowrap}.liveoption input{accent-color:var(--accent);margin:0}.btn{border:1px solid var(--line);background:#27313f;color:var(--text);border-radius:8px;padding:8px 10px;font:inherit;font-size:12px;font-weight:650}.btn.primary{background:#8bbcff;color:#111a28;border-color:transparent}#savePresetBtn{background:#d76568;color:#fff;border:2px solid #08090b;box-shadow:inset 0 -3px 0 rgba(0,0,0,.22);font-size:15px;padding:7px 14px;min-width:88px}.preset-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center}.preset-row select{min-width:0}.presskey-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px;align-items:end}.presskey-btn{min-height:36px;white-space:nowrap}.preset-title{margin-bottom:7px}.btn:disabled{opacity:.45}.midirow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px;align-items:end}.midirow select{font-size:12px}#presetSelect{font-size:14px}#savePresetBtn{min-height:36px;white-space:nowrap}.notice{font-size:11px;color:var(--muted);margin-top:7px;overflow-wrap:anywhere}.output{font:10px/1.55 ui-monospace,SFMono-Regular,Menlo,monospace;white-space:pre-wrap;overflow-wrap:anywhere;max-height:200px;overflow:auto;color:#c5dcff;margin:6px 0 0}.outhead{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:11px;color:var(--muted);margin-top:8px}.outbuttons{display:flex;gap:6px;margin-top:6px}.outbuttons button{flex:1}.diagnostic{font-size:10px;color:var(--muted);margin-top:6px;overflow-wrap:anywhere}
.app-footer{padding:5px 0 4px;text-align:center;font-size:10px;color:var(--muted);opacity:.72}.txlog{font:11px/1.45 ui-monospace,SFMono-Regular,Menlo,monospace;white-space:pre-wrap;overflow-wrap:anywhere;word-break:break-word;max-height:260px;overflow:auto;background:#0b1017;border:1px solid #303b49;border-radius:7px;padding:8px;margin:6px 0 0;color:#c5dcff;user-select:text;-webkit-user-select:text}.txloghead{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:11px;color:var(--muted);margin-top:10px}.txlogbuttons{display:flex;gap:6px}.txlogbuttons .btn{padding:5px 8px;font-size:11px}

/* v29.1 tab and control styling corrections */
.part-tabs{gap:0;align-items:stretch;position:relative}
.part-select{border:1px solid var(--line);border-radius:9px 9px 0 0;min-width:0;position:relative}
.part-select+ .part-select{margin-left:0}
.part-select.active-part{border:1px solid var(--accent);border-bottom-color:var(--panel);background:var(--panel);border-radius:9px 9px 0 0;margin-bottom:-1px;z-index:2}
/* The panel joins the tabs with square top corners and shares the active blue outline. */
#partsCard>.part{border-radius:0 0 10px 10px;border-top-color:var(--accent)}
#partsCard:has(#selectPart1.active-part) #part1Card,
#partsCard:has(#selectPart2.active-part) #part2Card{border-color:var(--accent)}
.patchfield{grid-template-columns:68px minmax(0,1fr)}
.patchfield .patchpicker{min-width:0;width:100%;grid-template-columns:minmax(0,1fr) 27px}
.patchfield select{width:100%;min-width:0}
/* Keep both step-control groups pixel-consistent. */
.octcontrol{gap:7px}
.reverbbox .stepbtn,.octcontrol .stepbtn{box-sizing:border-box;flex:0 0 36px;min-width:36px;width:36px;height:34px;padding:0;font:inherit;font-size:18px;font-weight:400;line-height:1;border-radius:8px}
.reverbbox .digital-display,.octcontrol .digital-display{height:24px;gap:4px;align-items:center;justify-content:center}
.reverbbox .digit,.octcontrol .digit{flex:0 0 11px;width:11px;height:18px}


/* v71: compact MIDI section and a separate vertical modulation wheel beside Preset. */
.preset-wheel-row{display:grid;grid-template-columns:48px minmax(0,1fr);gap:8px;align-items:start}
.preset-wheel-row>.card{min-width:0;margin-bottom:8px}
.preset-wheel-row .modwheel-wrap{height:186px;min-width:0;margin:0;padding:9px 6px 10px;display:flex;flex-direction:column;align-items:center;gap:7px;background:#151b24;border:1px solid var(--line);border-radius:11px}
.preset-wheel-row .modwheel-label{position:static;display:block;flex:none;width:auto;height:auto;margin:0;padding:0;transform:none;letter-spacing:.03em;font-size:10px;font-weight:650;line-height:1.2;text-align:center;color:var(--muted)}
.preset-wheel-row .modwheel{position:relative;display:block;flex:1 1 auto;width:29px;max-width:100%;min-width:0;min-height:0;height:auto;margin:0;padding:0;border:2px solid #586371;border-radius:9px;background:#080d14;cursor:ns-resize;touch-action:none;overflow:hidden;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
.preset-wheel-row .modwheel-fill{position:absolute;inset:auto 0 0 0;width:100%;height:0%;border-radius:0 0 6px 6px;background:linear-gradient(180deg,#56a2fa,#286ec9);pointer-events:none}
.preset-wheel-row .modwheel::after{content:"";position:absolute;left:3px;right:3px;top:50%;height:2px;border-radius:2px;background:rgba(255,255,255,.12);pointer-events:none}

@media(max-width:360px){
 .preset-wheel-row{grid-template-columns:43px minmax(0,1fr);gap:6px}
 .preset-wheel-row .modwheel-wrap{padding-left:5px;padding-right:5px}
 .preset-wheel-row .modwheel{width:27px}
}

/* v72: keep the wheel rail at exactly the same height as the Preset card. */
.preset-wheel-row{
  align-items:stretch;
  margin-bottom:8px;
}
.preset-wheel-row>.preset-card{
  margin-bottom:0;
}
.preset-wheel-row .modwheel-wrap{
  height:auto;
  align-self:stretch;
}

/* Keep Split Point and Reverb Level side by side at all screen widths. */
.preset-wheel-row .compacttop{
  grid-template-columns:minmax(0,1.26fr) minmax(0,1fr);
  column-gap:8px;
}

/* Narrow displays: scale buttons, lists, steppers, spacing and labels as one system. */
@media (max-width:480px){
  :root{
    --compact-control-height:clamp(31px, 8.9vw, 36px);
    --compact-step-width:clamp(28px, 8vw, 34px);
    --compact-gap:clamp(4px, 1.3vw, 6px);
  }
  .preset-wheel-row .compacttop{
    grid-template-columns:minmax(0,1.26fr) minmax(0,1fr);
    gap:var(--compact-gap);
  }
  .preset-wheel-row .presskey-row{gap:4px}
  .preset-wheel-row .reverbbox{gap:3px}
  .preset-wheel-row .reverbbox .stepbtn{
    flex:0 0 var(--compact-step-width);
    width:var(--compact-step-width);
    min-width:var(--compact-step-width);
    height:var(--compact-control-height);
    font-size:clamp(16px,4.2vw,18px);
  }
  .preset-wheel-row .presskey-btn{
    height:var(--compact-control-height);
    min-height:var(--compact-control-height);
    font-size:clamp(10px,2.8vw,12px);
    padding:0 clamp(4px,1.3vw,7px);
    border-radius:7px;
  }
  .midirow select,.preset-row select,.presskey-row select,
  .patchfield select,.slidernum{
    height:var(--compact-control-height);
    min-height:var(--compact-control-height);
    padding-top:3px;
    padding-bottom:3px;
  }
  .midirow .btn,.preset-row .btn{
    height:var(--compact-control-height);
    min-height:var(--compact-control-height);
    padding:0 clamp(6px,2vw,10px);
    font-size:clamp(11px,3vw,12px);
  }
  #savePresetBtn{
    height:var(--compact-control-height);
    min-height:var(--compact-control-height);
    min-width:clamp(65px,19vw,88px);
    padding:0 clamp(6px,2vw,12px);
    font-size:clamp(12px,3.6vw,15px);
  }
  .mode span{
    display:flex;
    min-height:var(--compact-control-height);
    height:var(--compact-control-height);
    align-items:center;
    justify-content:center;
    padding:0 2px;
    font-size:clamp(10px,2.85vw,12px);
    white-space:nowrap;
  }
  .part-select{
    padding:clamp(6px,2vw,9px) clamp(6px,2.5vw,10px);
    font-size:clamp(12px,3.4vw,14px);
  }
  .part-tab-label{font-size:clamp(10px,2.8vw,11px)}
  .octcontrol .stepbtn{
    flex-basis:var(--compact-step-width);
    min-width:var(--compact-step-width);
    width:var(--compact-step-width);
    height:var(--compact-control-height);
    font-size:clamp(16px,4.2vw,18px);
  }
  .sliderwrap{gap:var(--compact-gap)}
  .slidernum{
    width:clamp(42px,11.8vw,54px)!important;
    height:var(--compact-control-height);
    min-height:var(--compact-control-height)!important;
    padding:2px 1px!important;
  }
  .patchfield{gap:var(--compact-gap)}
  /* Input/select fonts stay at 16px on iOS to prevent focus-triggered zoom. */
}
@media (max-width:360px){
  .preset-wheel-row .compacttop{grid-template-columns:minmax(0,1.28fr) minmax(0,1fr)}
  .midirow{gap:5px}
  .preset-row{gap:6px}
  .preset-wheel-row .reverbbox{gap:2px}
}

/* v73: native form controls and buttons use one baseline and one height on tablets and desktops. */
@media (min-width:481px){
  .midirow select,.midirow>.btn{height:36px;min-height:36px}
  .preset-row select,.preset-row>.btn{height:37px;min-height:37px}
  .midirow>.btn,.preset-row>.btn{padding-top:0;padding-bottom:0;align-self:end}
}

/* First-generation iPhone SE and similarly short, narrow screens:
   reclaim vertical space through spacing rather than shrinking legibility/tap targets. */
@media (max-width:360px) and (max-height:680px){
  .wrap{padding-top:4px;padding-bottom:3px}
  .top{margin-bottom:5px}
  .card{padding:6px 8px;margin-bottom:5px}
  .cardhead{margin-bottom:5px}
  label{margin-bottom:2px}
  .midirow{gap:5px}
  .preset-wheel-row{margin-bottom:5px}
  .preset-wheel-row>.preset-card{padding:7px 8px}
  .preset-wheel-row .preset-title{margin-bottom:5px}
  .preset-wheel-row .field[style*="margin-top:10px"]{margin-top:6px!important}
  .preset-wheel-row .compacttop{margin-top:5px}
  #partsCard{padding:6px 8px}
  .part-select{padding-top:4px;padding-bottom:4px}
  .part-tab-label{margin-top:2px}
  #partsCard>.part{padding:7px 9px}
  .patchfield{margin-bottom:4px}
  .part-card .grid2{gap:5px}
  .resonance{margin-top:5px;min-height:26px}
  .part-resonance-space{margin-top:5px;min-height:26px}
  .app-footer{padding-top:2px;padding-bottom:2px}
}

/* v74: separate the patch stepper buttons without changing their or their arrows' dimensions. */
.patchnavstack{grid-template-rows:repeat(2,16px);gap:4px}
.patchnavstack .patchnav{height:16px;min-height:16px;padding:0;font-size:12px;line-height:1}

/* First-generation iPhone SE: give back just a few pixels of vertical breathing room. */
@media (max-width:360px) and (max-height:680px){
  .top{margin-bottom:6px}
  .card{padding:7px 8px;margin-bottom:6px}
  .preset-wheel-row{margin-bottom:6px}
  .preset-wheel-row>.preset-card{padding:8px 8px}
  #partsCard>.part{padding:8px 9px}
}

/* v75: separate the patch arrows by 2px, enlarge the touchable controls
   without shrinking the glyphs, and preserve the compact iPhone SE layout. */
.patchfield .patchpicker{grid-template-columns:minmax(0,1fr) 30px}
.patchnavstack{grid-template-rows:repeat(2,18px);gap:2px}
.patchnavstack .patchnav{width:30px;height:18px;min-height:18px;font-size:12px;line-height:1;touch-action:manipulation}

/* Chrome for Android highlights the whole clickable Part panel when a child
   button is tapped; suppress only that native tap-flash, not button focus. */
.part-card{-webkit-tap-highlight-color:transparent}

/* v79: center the patch selector and the two-step navigator on the same
   horizontal axis at every breakpoint. Keep the existing 30x18px buttons
   and 2px spacing, including on the first-generation iPhone SE. */
.patchfield .patchpicker{align-items:center}
.patchfield .patchpicker>select{align-self:center}
.patchfield .patchpicker>.patchnavstack{align-self:center}

/* v82: compact two-knob sound control; the MIDI controls below remain independent per part. */
.knob-pair{display:flex;align-items:flex-start;justify-content:center;gap:clamp(3px,1.6vw,12px);min-width:0}
.knob-unit{flex:0 1 57px;min-width:0;text-align:center;display:flex;align-items:center;flex-direction:column;gap:2px}

  runningStatus=status>=0x80&&status<0xF0?status:0;
 }
}

let bleConnectStage="not started";
async function connectBleMidi(){
 bleConnectStage="checking Web Bluetooth";
 if(!navigator.bluetooth||!navigator.bluetooth.requestDevice)throw new Error("Web Bluetooth is unavailable in this browser");
 bleConnectStage="opening Bluetooth device picker";
 const device=await navigator.bluetooth.requestDevice({acceptAllDevices:true,optionalServices:[BLE_MIDI_SERVICE]});
 bleDevice=device;
 device.addEventListener("gattserverdisconnected",()=>{
  bleCharacteristic=null;bleServer=null;bleSysExBuffer=null;
  ++readGeneration; ++nameReadGeneration; clearTimeout(recallReadTimer);
  $('midiOutput').innerHTML='<option value="">Not connected</option>';
  setDisconnected();status('Bluetooth MIDI disconnected.');
 });
 bleConnectStage="connecting to device GATT";
 bleServer=await device.gatt.connect();
 const service=await bleServer.getPrimaryService(BLE_MIDI_SERVICE);
 bleCharacteristic=await service.getCharacteristic(BLE_MIDI_CHARACTERISTIC);
 await bleCharacteristic.startNotifications();
 bleCharacteristic.addEventListener("characteristicvaluechanged",bleHandleNotification);
 const sel=$("midiOutput");sel.innerHTML="";
 const option=document.createElement("option");option.value="ble-midi";option.textContent=device.name||"GO:Piano MIDI (Bluetooth)";
 sel.appendChild(option);sel.value="ble-midi";
 currentMidiInput=null;updateMidiUi();requestIdentity();
}
$("connectBtn").addEventListener("click",async()=>{
 $("connectBtn").disabled=true;$("connectBtn").textContent="…";
 try{
  if(navigator.bluetooth&&navigator.bluetooth.requestDevice){await connectBleMidi();return;}
  if(!navigator.requestMIDIAccess)throw new Error("Neither Web MIDI nor Web Bluetooth is available in this browser");
  midiAccess=await navigator.requestMIDIAccess({sysex:true});
  midiAccess.onstatechange=()=>{refreshMidiOutputs();};
  refreshMidiOutputs();selectMidiInput();
  if(chosenMidiOutput())requestIdentity();else {setDisconnected();status("No MIDI outputs found.");}
 }catch(err){status("Connection error: "+(err.message||String(err)));setDisconnected();}
 finally{$("connectBtn").disabled=false;$("connectBtn").textContent="Connect";}
});
$("midiOutput").addEventListener("change",()=>{
 updateMidiUi();selectMidiInput();if(chosenMidiOutput())requestIdentity();else setDisconnected();
});
</script></body></html>
